<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Text Summarizer</title>
<style>
  :root {
    --bg: #242831;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b909c;
    --accent: #5b8cff;
    --accent-hover: #4a78e6;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 28px; font-size: 14px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted); font-size: 14px;
  }
  .tab.active { color: var(--text); border-color: var(--accent); }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .hidden { display: none; }

  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    background: #0f1115; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; font-size: 14px; font-family: inherit;
  }

  .dropzone {
    border: 1.5px dashed var(--border); border-radius: 8px;
    padding: 32px 16px; text-align: center; color: var(--muted);
    font-size: 14px; cursor: pointer;
  }
  .dropzone.drag { border-color: var(--accent); color: var(--text); }
  .dropzone input { display: none; }
  #fileName { margin-top: 8px; font-size: 13px; color: var(--text); }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  label.small { font-size: 13px; color: var(--muted); }
  input[type="number"] {
    width: 70px; background: #0f1115; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }

  button.primary {
    margin-top: 20px; width: 100%; padding: 12px; border: none;
    border-radius: 8px; background: var(--accent); color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .result { margin-top: 24px; }
  .result h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .summaryBox {
    background: #0f1115; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap;
  }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .error { color: var(--error); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>AI Text Summarizer</h1>
  <p class="sub">Paste Text or upload a .txt / .pdf file to get a summary.</p>

<div class="tabs">
    <div class="tab active" id="tabText" onclick="switchTab('text')">Paste text</div>
    <div class="tab" id="tabFile" onclick="switchTab('file')">Upload file</div>
    <div class="tab" id="tabClassify" onclick="switchTab('classify')">Classify message</div>
</div>

  <div class="panel">
    <div id="textPanel">
      <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    </div>

    <div id="filePanel" class="hidden">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".txt,.pdf">
        Click to choose a .txt or .pdf file, or drag one here
        <div id="fileName"></div>
      </div>
    </div>

    <div id="classifyPanel" class="hidden">
      <textarea id="classifyInput" placeholder="Paste a customer message to classify, e.g. 'My payment was deducted but my order was cancelled.'"></textarea>
    </div>

    <div class="row">
      <label class="small" for="maxWords">Target length (words):</label>
      <input type="number" id="maxWords" value="60" min="10" max="500">
    </div>

    <button class="primary" id="submitBtn" onclick="doSummarize()">Summarize</button>
    <button class="primary hidden" id="classifyBtn" onclick="doClassify()">Classify</button>
    <div class="error hidden" id="errorBox"></div>
  </div>

  <div class="result hidden" id="resultBox">
    <h2>Summary</h2>
    <div class="summaryBox" id="summaryText"></div>
    <div class="meta" id="metaText"></div>
  </div>
  <div class="result hidden" id="classifyResultBox">
    <h2>Classification</h2>
    <div class="summaryBox" id="classifyText"></div>
  </div>
</main>

<script>
let mode = "text";

function switchTab(target) {
  mode = target;
  document.getElementById('tabText').classList.toggle('active', target === 'text');
  document.getElementById('tabFile').classList.toggle('active', target === 'file');
  document.getElementById('tabClassify').classList.toggle('active', target === 'classify');
  document.getElementById('textPanel').classList.toggle('hidden', target !== 'text');
  document.getElementById('filePanel').classList.toggle('hidden', target !== 'file');
  document.getElementById('classifyPanel').classList.toggle('hidden', target !== 'classify');
  document.getElementById('submitBtn').classList.toggle('hidden', target === 'classify');
  document.getElementById('classifyBtn').classList.toggle('hidden', target !== 'classify');
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('classifyResultBox').classList.add('hidden');
  document.getElementById('errorBox').classList.add('hidden');
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFileName();
  }
});
fileInput.addEventListener('change', updateFileName);

function updateFileName() {
  const f = fileInput.files[0];
  document.getElementById('fileName').textContent = f ? `Selected: ${f.name}` : "";
}

async function doSummarize() {
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');
  const maxWords = document.getElementById('maxWords').value;

  errorBox.classList.add('hidden');
  resultBox.classList.add('hidden');

  let url, options;

  if (mode === "text") {
    const text = document.getElementById('textInput').value.trim();
    if (!text) { showError("Please paste some text first."); return; }
    url = "/summarize";
    options = {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, max_words: parseInt(maxWords) })
    };
  } else {
    const file = fileInput.files[0];
    if (!file) { showError("Please choose a file first."); return; }
    const formData = new FormData();
    formData.append("file", file);
    formData.append("max_words", maxWords);
    url = "/summarize/file";
    options = { method: "POST", body: formData };
  }

  btn.disabled = true;
  btn.textContent = "Summarizing...";

  try {
    const response = await fetch(url, options);
    const data = await response.json();

    if (!response.ok) {
      showError(typeof data.detail === "string" ? data.detail : "Something went wrong.");
      return;
    }

    document.getElementById('summaryText').textContent = data.summary;
    document.getElementById('metaText').textContent =
      `${data.original_length_words} words → ${data.summary_length_words} words`;
    resultBox.classList.remove('hidden');
  } catch (err) {
    showError("Could not reach the server. Is it still running?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Summarize";
  }
}

async function doClassify() {
  const btn = document.getElementById('classifyBtn');
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('classifyResultBox');
  const text = document.getElementById('classifyInput').value.trim();

  errorBox.classList.add('hidden');
  resultBox.classList.add('hidden');

  if (!text) { showError("Please paste a message first."); return; }

  btn.disabled = true;
  btn.textContent = "Classifying...";

  try {
    const response = await fetch("/classify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    const data = await response.json();

    if (!response.ok) {
      showError(typeof data.detail === "string" ? data.detail : "Something went wrong.");
      return;
    }

    document.getElementById('classifyText').textContent =
      `Intent: ${data.intent}\nPriority: ${data.priority}\nSentiment: ${data.sentiment}\nRequires human: ${data.requires_human}`;
    resultBox.classList.remove('hidden');
  } catch (err) {
    showError("Could not reach the server. Is it still running?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Classify";
  }
}

function showError(msg) {
  const errorBox = document.getElementById('errorBox');
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
}
</script>
</body>
</html>
